version: 9999
resources:
  - type: slot
    count: 2
    label: default
    with:
      - type: node
        count: 1
        exclusive: true
        with:
          - type: core
            count: 1
      - type: ssd
        count: 101

# Same rabbit-style multi-slot shape as dyn_explore/test001.yaml, but the ssd
# share is requested non-exclusively (no "exclusive: true") to cover the
# non-exclusive rank-less resource path of the partial-cancel leak fix.
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
