version: 9999
resources:
    - type: cluster
      count: 1
      with:
        - type: rack
          count: 1
          with:
            - type: node
              count: 1
              with:
                  - type: slot
                    count: 1
                    label: default
                    with:
                      - type: socket
                        count: 1
                        with:
                          - type: core
                            count: 1
# a sub-second (fractional) duration must round up to 1 second rather
# than truncate to 0, which the planner rejects with EINVAL
attributes:
  system:
    duration: 0.1
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
