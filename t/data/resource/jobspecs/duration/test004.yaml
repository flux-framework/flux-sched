version: 9999
resources:
    - type: cluster
      count: 1
      with:
        - type: rack
          count: 1
          with:
            - type: node
              count: 1
              with:
                  - type: slot
                    count: 1
                    label: default
                    with:
                      - type: socket
                        count: 1
                        with:
                          - type: core
                            count: 1
# a duration below int64_t min must be rejected rather than cast (UB).
# Must be a float at this scale; YAML/JSON may reject integers > 32 bits.
attributes:
  system:
    duration: -1.0E+30
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
