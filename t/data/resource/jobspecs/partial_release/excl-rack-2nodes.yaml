version: 9999
# Exclusive rack holding the rack's nodes (2 in tiny-partial-cancel.json)
resources:
    - type: cluster
      count: 1
      with:
        - type: rack
          count: 1
          exclusive: true
          with:
            - type: node
              count: 2
              with:
                  - type: slot
                    count: 1
                    label: default
                    with:
                      - type: socket
                        count: 1
                        with:
                          - type: core
                            count: 1
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
