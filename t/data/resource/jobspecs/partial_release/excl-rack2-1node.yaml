version: 9999
# Two exclusive racks with one node each in the request. The match gives
# the job all the nodes of both racks.
resources:
    - type: rack
      count: 2
      exclusive: true
      with:
        - type: node
          count: 1
          with:
              - type: slot
                count: 1
                label: default
                with:
                  - type: core
                    count: 1
attributes:
  system:
    duration: 3600
tasks:
  - command: [ "app" ]
    slot: default
    count:
      per_slot: 1
